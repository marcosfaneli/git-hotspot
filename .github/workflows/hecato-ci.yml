name: Hecato CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B clean verify
      - run: java -jar target/hecato-1.0-SNAPSHOT.jar graph src/main/java --json > /tmp/hecato.json
      - run: python3 -m json.tool /tmp/hecato.json > /dev/null
